# Northstar Phase 2 gate (step 2.11), local use only: nginx between the Cloudflare quick tunnel and the API.
#
# A quick tunnel publishes everything on the port it is pointed at, and the local Supabase signs tokens with a key built
# into its CLI, so the tunnel must never reach the API itself. This filter passes GET and POST on exactly
# /webhooks/whatsapp and answers 404 to everything else: every other path, every other method, every other spelling of
# that path. The upstream path is written out, so whatever a client sends, only that one path is ever asked for.
#
# Run by scripts/local/gate filter, which pins the image, publishes the port on 127.0.0.1 only and drops every
# privilege; docs/phase2-gate-runbook.md. Checked by WebhookFilterTests.

worker_processes 1;
pid /tmp/nginx.pid;

# Nothing here may log a request line: Meta's subscription handshake carries the verify token in its query. Failures to
# reach the API are logged at "error" and quote the request, so only critical problems are logged.
error_log stderr crit;

events {
    worker_connections 128;
}

http {
    access_log off;
    server_tokens off;
    default_type text/plain;

    # northstar.webhooks.max-body-bytes (Meta's maximum): longer bodies get 413 here.
    client_max_body_size 3m;

    # Every writable path is under /tmp: the container's file system is read-only.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8088;

        location = /webhooks/whatsapp {
            if ($request_method !~ ^(GET|POST)$) {
                return 404;
            }
            # nginx matches a location on the normalised path; the raw one must be exactly this, with or without a query.
            if ($request_uri !~ ^/webhooks/whatsapp(\?|$)) {
                return 404;
            }
            proxy_pass http://host.docker.internal:8080/webhooks/whatsapp;
            proxy_http_version 1.1;
            proxy_set_header Host localhost:8080;
            # The webhook is public and proves itself by its signature: no login ever crosses the tunnel.
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location / {
            return 404;
        }
    }
}
