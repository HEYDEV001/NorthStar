# Runs on every pull request to main and every push to main. The job names are the required status checks in
# the protect-main ruleset, so renaming a job means updating the ruleset too. On main, deploy-staging then deploys the
# commit once both of them pass (step 1.15).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push cancels an older pull-request run. On main nothing is cancelled, so a deploy is never cut off halfway;
# a newer run waits for the running one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Format check, unit and integration tests. Testcontainers uses the runner's Docker for Supabase Postgres.
      - name: Verify
        run: ./mvnw -B -ntp verify

      # The migration runner's own build (db/migrate, step 1.15): format check and packaging. Its tests run in Verify.
      - name: Verify the migration runner
        run: ./mvnw -B -ntp -f ../db/migrate/pom.xml verify

  # The cross-tenant suite (step 1.14): every P9, P10 and P11 test, selected by its case-ID name, plus the guard that
  # fails if a case test sits where this pattern would miss it. Its own job so its result shows on the pull request
  # and can be required on its own; the backend job still runs everything, these included.
  cross-tenant:
    name: cross-tenant
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cross-tenant suite (P9, P10, P11)
        run: ./mvnw -B -ntp test -Dtest='*Tests#P9_*+P10_*+P11_*,CrossTenantSuiteGuardTests'

  # The staging deploy (step 1.15, docs/staging-runbook.md): only for pushes to main, only after both required jobs
  # pass. It builds the image from this exact commit, pushes it as app-<sha>, checks that the live app still matches
  # .do/staging.app.yaml, then sets that tag on every component and waits. App Platform runs the migrate job first;
  # if migrations or the health check fail, the deployment fails and the previous version keeps running. After a
  # successful deploy it deletes every image tag but the deployed one and the one that ran before, starts registry
  # garbage collection and reports storage (the Starter registry holds 500 MiB). The DigitalOcean token is a secret of
  # the staging environment, which only main may use.
  # Opt-in: it runs only while the repository variable STAGING_DEPLOY_ENABLED is 'true'. Unset (staging hosting is
  # paused), the job shows as skipped. A repository variable, not one on the staging environment: this `if` is decided
  # before the job joins its environment. DeployWorkflowTests requires every one of these conditions.
  deploy-staging:
    name: deploy-staging
    needs: [backend, cross-tenant]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      APP_NAME: ${{ vars.DO_APP_NAME }}
      IMAGE: registry.digitalocean.com/${{ vars.DO_REGISTRY }}/northstar:app-${{ github.sha }}
      # Starter registry: keep 2 tags within 500 MiB. On Basic, set the environment variables to 20 and 5120.
      KEEP_TAGS: ${{ vars.DO_REGISTRY_KEEP_TAGS || '2' }}
      LIMIT_MIB: ${{ vars.DO_REGISTRY_LIMIT_MIB || '500' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          version: 1.186.0

      # Registry credentials that expire in 20 minutes, kept only on this runner.
      - name: Log in to the container registry
        run: doctl registry login --expiry-seconds 1200

      # The registry is read-only while garbage collection (started by the previous deploy) runs.
      - name: Wait for registry garbage collection
        run: .github/scripts/wait-for-registry-gc.sh

      - name: Build and push the image
        run: |
          docker build -f backend/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Check the live app against .do/staging.app.yaml
        run: .github/scripts/check-staging-spec.sh "$APP_NAME"

      # The tags the app runs now: the cleanup keeps them as the rollback target.
      - name: Record the running image tags
        id: running
        run: echo "tags=$(.github/scripts/running-image-tags.sh "$APP_NAME")" >> "$GITHUB_OUTPUT"

      # Takes the live spec (so the encrypted secrets stay as they are), changes only the image tags, and waits for the
      # deployment. Build and deploy logs are not printed.
      - name: Deploy
        uses: digitalocean/app_action/deploy@cc55bc9b848d25f9c1c9f831cf843fbab3fbfb15 # v2.0.11
        env:
          IMAGE_TAG_API: app-${{ github.sha }}
          IMAGE_TAG_WORKER: app-${{ github.sha }}
          IMAGE_TAG_MIGRATE: app-${{ github.sha }}
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          app_name: ${{ vars.DO_APP_NAME }}

      # Only after a successful deploy. Deletes the other tags, starts garbage collection (one already running is not a
      # failure), prints the storage used and warns above 80% of LIMIT_MIB.
      - name: Clean up the registry
        env:
          RUNNING_TAGS: ${{ steps.running.outputs.tags }}
        run: .github/scripts/clean-registry.sh "app-${{ github.sha }}" "$RUNNING_TAGS"
