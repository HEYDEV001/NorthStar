# Test runs only (this file is on the test classpath, never in the app or its image). Spring Boot reads
# classpath:/config/application.properties after classpath:/application.properties, so this wins.
#
# Tests never read the developer's .env.local: the same test must behave the same locally and in CI. The app's import
# of ../.env.local (src/main/resources/application.properties) follows this setting, and here it is empty, so nothing
# is imported. LocalEnvFileTests fails if a test environment ever imports it. ./mvnw spring-boot:test-run, a local run
# rather than a test, turns the import back on (TestNorthstarApplication).
northstar.local-env.import=
