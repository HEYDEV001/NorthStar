spring.application.name=northstar

# Local runs read the repo-root .env.local; in CI and production the file is absent and real env vars are used. Tests
# never read it: src/test/resources/config/application.properties sets northstar.local-env.import to nothing, so a test
# behaves the same on a developer's machine as in CI (LocalEnvFileTests).
spring.config.import=${northstar.local-env.import:optional:file:../.env.local[.properties]}

# Runtime connection is the restricted app_user role (no BYPASSRLS). Never postgres or service_role.
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
# Supabase's transaction pooler cannot keep server-side prepared statements across transactions.
spring.datasource.hikari.data-source-properties.prepareThreshold=0
# Database errors carry only Postgres's primary message, never its detail: "Key (column)=(value) already exists",
# "Failing row contains (...)", JSON fragments or a failed batch's statement with its values would otherwise reach the
# logs inside exception messages. The SQL state and constraint name are kept. Every pool sets this: the app's (here),
# JobRunr's (JobsConfiguration), the worker's credential pool (CredentialsConfiguration) and the migration runner.
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false
# No connectionTestQuery or connection init SQL: statements need a tenant transaction; validation uses isValid().

# JPA (D7). Flyway owns the schema: Hibernate only checks the entities against it at startup.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# No shared caches: a cached row could outlive the tenant context it was read under.
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.jakarta.persistence.sharedCache.mode=NONE

# JobRunr (step 1.10) connects through its own small pool as jobrunr_user, which may use only the jobrunr schema. Same
# database and pooler as the app (JobRunr keeps no session state), so the same prepareThreshold=0 applies (set in code).
northstar.jobs.database.url=${DB_URL:}
northstar.jobs.database.username=${JOBRUNR_DB_USER:}
northstar.jobs.database.password=${JOBRUNR_DB_PASSWORD:}
northstar.jobs.database.pool-size=5
# Tenant credentials (step 2.1b, integration-specs.md section 7): only the worker reads them, through its own small
# pool as secrets_user, the only role that may use the secrets schema. Same database and pooler as the app. The keys are
# comma-separated keyId:base64 entries of exactly 32 random bytes; the active key ID encrypts new values. All of these
# are required only when NORTHSTAR_WORKER_ENABLED=true, and set only on the worker; the API never reads them.
northstar.credentials.database.url=${DB_URL:}
northstar.credentials.database.username=${SECRETS_DB_USER:}
northstar.credentials.database.password=${SECRETS_DB_PASSWORD:}
northstar.credentials.database.pool-size=2
northstar.credentials.keys=${NORTHSTAR_CREDENTIAL_KEYS:}
northstar.credentials.active-key=${NORTHSTAR_CREDENTIAL_ACTIVE_KEY:}
# The background job server runs only where NORTHSTAR_WORKER_ENABLED=true (the worker container); the API containers
# only create jobs. No dashboard, no JobRunr retries (see com.northstar.jobs.JobsConfiguration).
northstar.worker.enabled=${NORTHSTAR_WORKER_ENABLED:false}
northstar.worker.threads=4
northstar.worker.poll-interval=15s
# An action being processed is leased for this long. Every handler's timeout must be shorter (checked at startup).
northstar.actions.lease=5m

# WhatsApp webhooks (step 2.2, integration-specs.md sections 1, 2 and 7) at /webhooks/whatsapp. Meta's app secret signs
# every delivery (X-Hub-Signature-256); the verify token answers Meta's subscription handshake. Both are platform
# secrets, set only where the webhook is served (the api component; locally, the one process). Active whenever both
# are set. Either missing: an API container (worker off) refuses to start; a worker-on process answers 503 on the
# webhook paths. Each is 32 to 512 printable characters.
northstar.webhooks.whatsapp.app-secret=${NORTHSTAR_WHATSAPP_APP_SECRET:}
northstar.webhooks.whatsapp.verify-token=${NORTHSTAR_WHATSAPP_VERIFY_TOKEN:}
# Meta's webhook payloads are at most 3 MB; anything longer is refused (413) before it is read past this.
northstar.webhooks.max-body-bytes=3145728
# Writes to ingest.unrouted_webhooks, per API instance (the parking functions also cap them across all instances: 60
# and 600 a minute). Over the limit nothing is stored and the answer is unchanged.
northstar.webhooks.unrouted.invalid-signature-per-minute=30
northstar.webhooks.unrouted.unknown-account-per-minute=120

# Schema changes belong to Flyway under the migrator role, never the running app.
spring.sql.init.mode=never

# Used only in tests: Flyway is on the test classpath, not the runtime one (see db/migrations/README.md).
spring.flyway.locations=filesystem:../db/migrations
spring.flyway.schemas=northstar
spring.flyway.create-schemas=true

# Supabase Auth (step 1.5). Tokens are verified against Supabase's public signing keys (JWKS); asymmetric algorithms
# only. SUPABASE_URL is required: without it the app refuses to start rather than accept nothing.
northstar.auth.issuer=${SUPABASE_URL:}/auth/v1
northstar.auth.jwk-set-uri=${northstar.auth.issuer}/.well-known/jwks.json
northstar.auth.audience=authenticated
# A slow or unreachable Supabase must not hold request threads: fetching the signing keys gives up quickly.
northstar.auth.jwks-connect-timeout=2s
northstar.auth.jwks-read-timeout=5s

# The React app's address, for links Northstar sends people (invite links). Required in hosted environments.
northstar.app.base-url=${NORTHSTAR_APP_URL:http://localhost:5173}

# Email (step 1.12). Resend by default; mailpit only for local development (localhost only). Only the worker sends
# email, so the sender, Resend's key and the invite token key are required only when NORTHSTAR_WORKER_ENABLED=true.
northstar.email.provider=${NORTHSTAR_EMAIL_PROVIDER:resend}
northstar.email.from=${NORTHSTAR_EMAIL_FROM:}
northstar.email.resend.api-key=${RESEND_API_KEY:}
northstar.email.resend.base-url=https://api.resend.com
northstar.email.mailpit.url=${NORTHSTAR_MAILPIT_URL:http://127.0.0.1:54324}
# 32+ random bytes, base64. Invite tokens are HMAC-SHA256 of this key and the email action's ID.
northstar.invites.token-key=${NORTHSTAR_INVITE_TOKEN_KEY:}

# API conventions (step 1.6). This JSON mapper is for our own API bodies and is strict: unknown fields, fractions
# into integers (amounts are integer paise), nulls into primitives and trailing tokens are all 400s. Provider payloads
# (WhatsApp, Razorpay, Meta, Google) are parsed with a separate lenient mapper, never this one.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-null-for-primitives=true
spring.jackson.deserialization.fail-on-trailing-tokens=true
# Timestamps are ISO-8601 in UTC (DTOs use Instant, which always ends in Z).
spring.jackson.datatype.datetime.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
# JSON API only: no static resources, and no Spring Boot error page (ApiErrorController answers in our format).
spring.web.resources.add-mappings=false
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Every log line carries the request ID, and the tenant and user while a request runs in a tenant scope (IDs only).
# The trailing   keeps a space before the message; editors strip plain trailing spaces.
logging.pattern.correlation=[request_id=%X{request_id:-} tenant_id=%X{tenant_id:-} user_id=%X{user_id:-}] 

# Pinned: only health is exposed over HTTP. Widening this exposes env, beans or configprops; keep it to health.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
