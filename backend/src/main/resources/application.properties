spring.application.name=northstar

# Local runs read the repo-root .env.local; in CI and production the file is absent and real env vars are used.
spring.config.import=optional:file:../.env.local[.properties]

# Runtime connection is the restricted app_user role (no BYPASSRLS). Never postgres or service_role.
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}

# Schema changes belong to Flyway under the migrator role, never the running app.
spring.sql.init.mode=never

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
