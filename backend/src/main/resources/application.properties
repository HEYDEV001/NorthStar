spring.application.name=northstar

# Local runs read the repo-root .env.local; in CI and production the file is absent and real env vars are used.
spring.config.import=optional:file:../.env.local[.properties]

# Runtime connection is the restricted app_user role (no BYPASSRLS). Never postgres or service_role.
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
# Supabase's transaction pooler cannot keep server-side prepared statements across transactions.
spring.datasource.hikari.data-source-properties.prepareThreshold=0
# No connectionTestQuery or connection init SQL: statements need a tenant transaction; validation uses isValid().

# JPA (D7). Flyway owns the schema: Hibernate only checks the entities against it at startup.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# No shared caches: a cached row could outlive the tenant context it was read under.
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.jakarta.persistence.sharedCache.mode=NONE

# JobRunr (step 1.10) connects through its own small pool as jobrunr_user, which may use only the jobrunr schema. Same
# database and pooler as the app (JobRunr keeps no session state), so the same prepareThreshold=0 applies (set in code).
northstar.jobs.database.url=${DB_URL:}
northstar.jobs.database.username=${JOBRUNR_DB_USER:}
northstar.jobs.database.password=${JOBRUNR_DB_PASSWORD:}
northstar.jobs.database.pool-size=5
# The background job server runs only where NORTHSTAR_WORKER_ENABLED=true (the worker container); the API containers
# only create jobs. No dashboard, no JobRunr retries (see com.northstar.jobs.JobsConfiguration).
northstar.worker.enabled=${NORTHSTAR_WORKER_ENABLED:false}
northstar.worker.threads=4
northstar.worker.poll-interval=15s
# An action being processed is leased for this long. Every handler's timeout must be shorter (checked at startup).
northstar.actions.lease=5m

# Schema changes belong to Flyway under the migrator role, never the running app.
spring.sql.init.mode=never

# Used only in tests: Flyway is on the test classpath, not the runtime one (see db/migrations/README.md).
spring.flyway.locations=filesystem:../db/migrations
spring.flyway.schemas=northstar
spring.flyway.create-schemas=true

# Supabase Auth (step 1.5). Tokens are verified against Supabase's public signing keys (JWKS); asymmetric algorithms
# only. SUPABASE_URL is required: without it the app refuses to start rather than accept nothing.
northstar.auth.issuer=${SUPABASE_URL:}/auth/v1
northstar.auth.jwk-set-uri=${northstar.auth.issuer}/.well-known/jwks.json
northstar.auth.audience=authenticated
# A slow or unreachable Supabase must not hold request threads: fetching the signing keys gives up quickly.
northstar.auth.jwks-connect-timeout=2s
northstar.auth.jwks-read-timeout=5s

# The React app's address, for links Northstar sends people (invite links). Required in hosted environments.
northstar.app.base-url=${NORTHSTAR_APP_URL:http://localhost:5173}

# API conventions (step 1.6). This JSON mapper is for our own API bodies and is strict: unknown fields, fractions
# into integers (amounts are integer paise), nulls into primitives and trailing tokens are all 400s. Provider payloads
# (WhatsApp, Razorpay, Meta, Google) are parsed with a separate lenient mapper, never this one.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-null-for-primitives=true
spring.jackson.deserialization.fail-on-trailing-tokens=true
# Timestamps are ISO-8601 in UTC (DTOs use Instant, which always ends in Z).
spring.jackson.datatype.datetime.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
# JSON API only: no static resources, and no Spring Boot error page (ApiErrorController answers in our format).
spring.web.resources.add-mappings=false
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Every log line carries the request ID, and the tenant and user while a request runs in a tenant scope (IDs only).
# The trailing   keeps a space before the message; editors strip plain trailing spaces.
logging.pattern.correlation=[request_id=%X{request_id:-} tenant_id=%X{tenant_id:-} user_id=%X{user_id:-}] 

# Pinned: only health is exposed over HTTP. Widening this exposes env, beans or configprops; keep it to health.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
